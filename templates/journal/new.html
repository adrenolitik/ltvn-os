{% extends "base.html" %}

{% block title %}Новая запись — Frame OS{% endblock %}

{% block page_title %}Новая запись в журнал{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px;">
    <form method="post" action="/journal/new">
        <div class="card-header"><span class="card-title">Запись в дневник</span></div>
        <div class="card-body">
            <div class="form-group">
                <label class="form-label">Цикл</label>
                {% if cycle %}
                <input type="hidden" name="cycle_slug" value="{{ cycle.slug }}">
                <input type="hidden" name="week" value="{{ cycle.week }}">
                <div style="padding: 10px 12px; background: var(--bg-tertiary); border-radius: var(--radius); border: 1px solid var(--border);">
                    <strong>{{ cycle.title }}</strong> (неделя {{ cycle.week }})
                </div>
                {% else %}
                <select name="cycle_slug" class="form-select" required>
                    <option value="">Выбери цикл</option>
                    {% for c in cycles %}
                    <option value="{{ c.slug }}">{{ c.title }} (№{{ c.number }})</option>
                    {% endfor %}
                </select>
                <div class="form-group">
                    <label class="form-label" for="week">Неделя цикла</label>
                    <input type="number" id="week" name="week" class="form-input" min="1" max="12" value="1" required>
                </div>
                {% endif %}
            </div>

            <div class="form-group">
                <label class="form-label" for="date">Дата</label>
                <input type="date" id="date" name="date" class="form-input" value="{{ today }}" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="mood">Настроение (1-10)</label>
                    <input type="number" id="mood" name="mood" class="form-input" min="1" max="10" placeholder="7">
                </div>
                <div class="form-group">
                    <label class="form-label" for="energy">Энергия (1-10)</label>
                    <input type="number" id="energy" name="energy" class="form-input" min="1" max="10" placeholder="6">
                </div>
                <div class="form-group">
                    <label class="form-label" for="focus">Фокус (1-10)</label>
                    <input type="number" id="focus" name="focus" class="form-input" min="1" max="10" placeholder="8">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="tags">Теги (через запятую)</label>
                <input type="text" id="tags" name="tags" class="form-input" placeholder="работа, здоровье, обучение, инсайт">
            </div>

            <div class="form-group">
                <label class="form-label" for="content">Содержимое</label>
                <textarea id="content" name="content" class="form-textarea" placeholder="Что было сделано? Что получилось? Что нет? Инсайты? Планы на завтра?" style="min-height: 200px;"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Сохранить запись</button>
                <a href="/journal" class="btn btn-secondary">Отмена</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
